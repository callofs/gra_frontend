<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.14" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(340 220) rotate(90) scale(260 360)">
      <stop stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0" />
