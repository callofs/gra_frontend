    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 380) rotate(90) scale(240 340)">
      <stop stop-color="#22D3EE" stop-opacity="0.32" />
