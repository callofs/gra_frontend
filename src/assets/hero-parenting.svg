      <stop stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-50" y="-50" width="1300" height="800" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1200" height="700" rx="36" fill="url(#bg)" />
  <rect width="1200" height="700" rx="36" fill="url(#glow1)" />
  <rect width="1200" height="700" rx="36" fill="url(#glow2)" />

  <g filter="url(#shadow)">
